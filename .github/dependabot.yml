version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # @types/vscode must track engines.vscode (the minimum supported VS Code
      # version), never the latest release: bumping it above engines.vscode
      # makes `vsce publish` reject the package.
      - dependency-name: "@types/vscode"
      # TypeScript major updates are held back until @typescript-eslint supports them
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
