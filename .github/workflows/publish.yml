name: Test and Publish Extension

on:
  # Manual fallback: automated publishing lives in release-please.yml because
  # releases created with the automatic GITHUB_TOKEN don't trigger this event.
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run format:check

      - name: Run Tests
        run: xvfb-run -a npm test

      - name: Package Extension
        run: npx @vscode/vsce package --out DockerComposeSorter.vsix

      - name: Attach VSIX to GitHub Release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" DockerComposeSorter.vsix --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --packagePath DockerComposeSorter.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx publish DockerComposeSorter.vsix
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
