name: Feature Request
description: Suggest an idea or enhancement for Docker Compose Sorter
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement! Please explain your use case and how this feature would work.

  - type: textarea
    id: problem
    attributes:
      label: Problem Description / Motivation
      description: Is your feature request related to a specific problem or Compose structure? Please describe clearly.
      placeholder: e.g. "I'm always frustrated when Compose profiles aren't grouped..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Behavior
      description: Describe the solution or new setting you'd like to see implemented.
      placeholder: Describe the desired behavior or configuration option.
    validations:
      required: true

  - type: textarea
    id: compose-example
    attributes:
      label: Example Docker Compose snippet
      description: Before / After formatting example demonstrating the desired feature.
      render: yaml
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
    validations:
      required: false
